<!doctype html> <html lang="vi"> <head> <meta charset="utf-8"> <meta name="color-scheme" content="light dark"> <link rel="stylesheet" href="sidepanel.css"> <script> // Đặt theme sớm để tránh nháy khi mở panel (đọc từ settings đã lưu).
try {
  chrome.storage.local.get('settings', (s) => {
    const theme = (s.settings || {}).theme || 'system';
    const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  });
} catch { /* kệ */ } </script> <title>Dọn Bookmark</title> </head> <body> <header> <h1 data-i18n="app.title">🧹 Dọn Bookmark</h1> <div class="actions"> <button id="scanBtn" class="primary" data-i18n="header.scan">🔍 Quét</button> <button id="undoBtn" disabled data-i18n="header.undo" data-i18n-title="header.undo.title" title="Hoàn tác lần áp dụng gần nhất">↩ Hoàn tác</button> <button id="backupBtn" data-i18n="header.backup" data-i18n-title="header.backup.title" title="Tải file backup HTML">💾 Sao lưu</button> <button id="themeBtn" data-i18n-title="header.theme.title" title="Chế độ tối">🌙</button> <button id="langBtn" data-i18n-title="header.lang.title" title="Chuyển sang tiếng Anh">EN</button> <button id="settingsBtn" data-i18n-title="header.settings.title" title="Mở cài đặt">⚙</button> </div> </header> <div id="progress" class="hidden"> <div class="bar"><div id="barFill"></div></div> <span id="progressText" data-i18n="scan.progress.prepare">Đang chuẩn bị…</span> </div> <div id="stats" class="hidden"></div> <nav id="tabs"> <button data-tab="dead"><span data-i18n="tabs.dead">☠ Chết</span> <b id="cDead">0</b></button> <button data-tab="review"><span data-i18n="tabs.review">⚠ Xem lại</span> <b id="cReview">0</b></button> <button data-tab="dup"><span data-i18n="tabs.dup">⧉ Trùng</span> <b id="cDup">0</b></button> <button data-tab="org"><span data-i18n="tabs.org">📁 Sắp xếp</span> <b id="cOrg">0</b></button> <button data-tab="skip"><span data-i18n="tabs.skip">⏭ Bỏ qua</span> <b id="cSkip">0</b></button> </nav> <main id="list"> <div class="empty" data-i18n="empty.hint">Bấm <b>🔍 Quét</b> để bắt đầu kiểm tra toàn bộ bookmark.</div> </main> <footer id="applyBar" class="hidden"> <span id="applySummary"></span> <button id="applyBtn" class="primary" data-i18n="apply.btn">Sao lưu & Áp dụng</button> </footer> <script src="sidepanel.js" type="module"></script> </body> </html>
