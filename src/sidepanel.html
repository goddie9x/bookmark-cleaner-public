<!doctype html> <html lang="vi"> <head> <meta charset="utf-8"> <link rel="stylesheet" href="sidepanel.css"> <title>Dọn Bookmark</title> </head> <body> <header> <h1>🧹 Dọn Bookmark</h1> <div class="actions"> <button id="scanBtn" class="primary">🔍 Quét</button> <button id="undoBtn" disabled title="Hoàn tác lần áp dụng gần nhất">↩ Hoàn tác</button> <button id="backupBtn" title="Tải file backup HTML">💾 Sao lưu</button> <button id="settingsBtn" title="Mở cài đặt">⚙</button> </div> </header> <div id="progress" class="hidden"> <div class="bar"><div id="barFill"></div></div> <span id="progressText">Đang chuẩn bị…</span> </div> <div id="stats" class="hidden"></div> <nav id="tabs"> <button data-tab="dead">☠ Chết <b id="cDead">0</b></button> <button data-tab="review">⚠ Xem lại <b id="cReview">0</b></button> <button data-tab="dup">⧉ Trùng <b id="cDup">0</b></button> <button data-tab="org">📁 Sắp xếp <b id="cOrg">0</b></button> <button data-tab="skip">⏭ Bỏ qua <b id="cSkip">0</b></button> </nav> <main id="list"> <div class="empty">Bấm <b>🔍 Quét</b> để bắt đầu kiểm tra toàn bộ bookmark.</div> </main> <footer id="applyBar" class="hidden"> <span id="applySummary"></span> <button id="applyBtn" class="primary">Sao lưu & Áp dụng</button> </footer> <script src="sidepanel.js" type="module"></script> </body> </html>
